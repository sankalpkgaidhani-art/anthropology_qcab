<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anthropology QCAB Generator</title>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 30px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin-bottom: 30px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 7px;
        }

        select,
        input {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 16px;
            background: white;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 18px;
            font-size: 15px;
            cursor: pointer;
            background: var(--primary);
            color: white;
        }

        button:hover {
            background: var(--primary-dark);
        }

        button.secondary {
            background: #64748b;
        }

        button.secondary:hover {
            background: #475569;
        }

        button.danger {
            background: var(--danger);
        }

        button.danger:hover {
            background: #b91c1c;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .question {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 10px;
            background: #fff;
        }

        .question label {
            display: flex;
            gap: 10px;
            align-items: flex-start;
            font-weight: normal;
            cursor: pointer;
        }

        .question input[type="checkbox"] {
            width: auto;
            margin-top: 3px;
            margin-bottom: 0;
        }

        .question-meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .selected-count {
            margin: 15px 0;
            font-weight: 600;
        }

        #loginScreen {
            max-width: 430px;
            margin: 70px auto;
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
        }

        #loginScreen h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 25px;
        }

        #loginMessage {
            text-align: center;
            margin-top: 15px;
            color: var(--danger);
            font-size: 14px;
        }

        .auth-links {
            text-align: center;
            margin-top: 18px;
        }

        .auth-links button {
            background: none;
            color: var(--primary);
            padding: 4px;
            font-size: 14px;
        }

        .auth-links button:hover {
            background: none;
            text-decoration: underline;
        }

        #logoutContainer {
            max-width: 1000px;
            margin: 15px auto 0;
            padding: 0 20px;
            text-align: right;
        }

        #logoutButton {
            background: var(--danger);
        }

        #logoutButton:hover {
            background: #b91c1c;
        }

        .hidden {
            display: none !important;
        }

        .mode-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .mode-button {
            background: #e2e8f0;
            color: #1e293b;
        }

        .mode-button.active {
            background: var(--primary);
            color: white;
        }

        .success-message {
            color: var(--success);
            text-align: center;
            margin-top: 15px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 12px;
            }

            .card {
                padding: 18px;
            }

            #loginScreen {
                margin: 30px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         LOGIN SCREEN
    ========================== -->

    <div id="loginScreen">

        <h2>Anthropology QCAB</h2>

        <div id="loginForm">

            <label for="loginEmail">Email</label>
            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >

            <label for="loginPassword">Password</label>
            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                autocomplete="current-password"
            >

            <button
                id="loginButton"
                type="button"
                style="width: 100%;"
            >
                Login
            </button>

            <div class="auth-links">

                <button
                    id="showSignupButton"
                    type="button"
                >
                    Create a new account
                </button>

                <br>

                <button
                    id="forgotPasswordButton"
                    type="button"
                >
                    Forgot password?
                </button>

            </div>

        </div>


        <!-- =========================
             SIGNUP FORM
        ========================== -->

        <div id="signupForm" class="hidden">

            <h3 style="text-align:center;">Create Account</h3>

            <label for="signupEmail">Email</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                autocomplete="email"
            >

            <label for="signupPassword">Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create a password"
                autocomplete="new-password"
            >

            <button
                id="signupButton"
                type="button"
                style="width: 100%;"
            >
                Create Account
            </button>

            <div class="auth-links">

                <button
                    id="backToLoginButton"
                    type="button"
                >
                    Already have an account? Login
                </button>

            </div>

        </div>


        <p id="loginMessage"></p>

    </div>


    <!-- =========================
         LOGOUT
    ========================== -->

    <div
        id="logoutContainer"
        style="display: none;"
    >
        <button
            id="logoutButton"
            type="button"
        >
            Logout
        </button>
    </div>


    <!-- =========================
         MAIN QCAB GENERATOR
    ========================== -->

    <div
        id="mainContent"
        style="display: none;"
    >

        <div class="container">

            <h1>Anthropology QCAB Generator</h1>

            <p class="subtitle">
                Generate UPSC Anthropology Optional Question-Cum-Answer Booklets
            </p>


            <!-- MODE -->

            <div class="card">

                <h3>Selection Mode</h3>

                <div class="mode-row">

                    <button
                        id="topicModeButton"
                        class="mode-button active"
                        type="button"
                    >
                        Topic-wise
                    </button>

                    <button
                        id="yearModeButton"
                        class="mode-button"
                        type="button"
                    >
                        Year-wise
                    </button>

                </div>

            </div>


            <!-- FILTERS -->

            <div class="card">

                <h3>Choose Questions</h3>

                <label for="paperSelect">
                    Anthropology Paper
                </label>

                <select id="paperSelect">

                    <option value="">
                        Select Paper
                    </option>

                    <option value="Paper I">
                        Paper I
                    </option>

                    <option value="Paper II">
                        Paper II
                    </option>

                </select>


                <!-- TOPIC FILTER -->

                <div id="topicSection">

                    <label for="topicSelect">
                        Topic
                    </label>

                    <select id="topicSelect">

                        <option value="">
                            Select Topic
                        </option>

                    </select>

                </div>


                <!-- YEAR FILTER -->

                <div id="yearSection">

                    <label for="yearSelect">
                        Year
                    </label>

                    <select id="yearSelect">

                        <option value="">
                            Select Year
                        </option>

                    </select>

                </div>


                <div class="button-row">

                    <button
                        id="loadQuestions"
                        type="button"
                    >
                        Load Questions
                    </button>

                </div>

            </div>


            <!-- QUESTIONS -->

            <div
                class="card"
                id="questionsCard"
                style="display:none;"
            >

                <h3>Select Questions</h3>

                <div class="button-row">

                    <button
                        id="selectAll"
                        type="button"
                    >
                        Select All
                    </button>

                    <button
                        id="clearAll"
                        type="button"
                        class="secondary"
                    >
                        Clear All
                    </button>

                </div>

                <div
                    id="selectedCount"
                    class="selected-count"
                >
                    Selected: 0
                </div>

                <div id="questionsList"></div>

            </div>


            <!-- GENERATE -->

            <div
                class="card"
                id="generateCard"
                style="display:none;"
            >

                <h3>Generate QCAB</h3>

                <p>
                    Generate a PDF containing the selected questions
                    followed by answer-writing pages.
                </p>

                <button
                    id="generateQCAB"
                    type="button"
                >
                    Generate QCAB PDF
                </button>

                <div style="margin-top:15px;">

                    <button
                        id="downloadQCAB"
                        type="button"
                        style="display:none;"
                    >
                        Download QCAB PDF
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =========================
         LIBRARIES
    ========================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <!-- =========================
         SUPABASE + APP LOGIC
    ========================== -->

    <script>

        /* =========================================
           SUPABASE CONFIGURATION
        ========================================= */

        const API_URL =
            "https://govhlwqbobforvprdlps.supabase.co/functions/v1/get-questions";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_lr04EFZActHWsuFS9S24QQ_ryPJMYFM";

        const SUPABASE_URL =
            "https://govhlwqbobforvprdlps.supabase.co";


        window.supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        /* =========================================
           ELEMENTS
        ========================================= */

        const loginScreen =
            document.getElementById("loginScreen");

        const loginForm =
            document.getElementById("loginForm");

        const signupForm =
            document.getElementById("signupForm");

        const mainContent =
            document.getElementById("mainContent");

        const logoutContainer =
            document.getElementById("logoutContainer");

        const loginMessage =
            document.getElementById("loginMessage");


        /* =========================================
           TOPIC DATA
        ========================================= */

        const paperITopics = [

            "1.1 Meaning, Scope and development of Anthropology",

            "1.4 Human Evolution and emergence of Man",

            "1.5 Characteristics of Primates",

            "1.6 Phylogenetic status, characteristics and geographical distribution",

            "1.7 The biological basis of life",

            "1.8 Prehistoric Archaeology",

            "2.1 Nature of Culture",

            "2.2 Nature of Society",

            "2.3 Marriage",

            "2.4 Family",

            "2.5 Kinship",

            "3 Economic organization",

            "4 Political organization and Social Control",

            "5 Religion",

            "6.1 Classical evolutionism (Tylor, Morgan and Frazer)",

            "6.2 Historical particularism (Boas); Diffusionism (British, German and American)",

            "6.3 Functionalism (Malinowski); Structural-functionalism (Radcliffe-Brown)",

            "6.4 Structuralism (Levi-Strauss and E. Leach)",

            "6.5 Culture and personality (Benedict, Mead, Linton, Kardiner and Cora-du-Bois)",

            "6.6 Neo-evolutionism (Childe, White, Steward, Sahlins and Service)",

            "6.7 Cultural materialism (Harris)",

            "6.8 Symbolic and interpretive theories (Turner, Schneider and Geertz)",

            "6.9 Cognitive theories (Tyler, Conklin)",

            "6.10 Post-modernism in anthropology",

            "7. Culture, language and communication",

            "8. Research methods in anthropology",

            "9.1 Human Genetics: Methods and Application",

            "9.2 Mendelian genetics",

            "9.3 Genetic polymorphism/selection/Hardy-Weinberg/evolutionary forces/inbreeding/consanguinity/genetic load",

            "9.4 Chromosomes/aberrations, sex/autosomal syndromes, genetic imprinting/screening/counselling/DNA profiling/gene mapping/genome study",

            "9.5 Race/racism/morphological variation/racial criteria/classification/differentiation/race crossing",

            "9.6 Genetic markers/blood groups/physiology",

            "9.7 Ecological Anthropology/biocultural adaptation/environmental stresses/conservation",

            "9.8 Epidemiological Anthropology/health/disease/malnutrition",

            "10 Human growth/development/somatotypes/ageing/growth methods",

            "11.1 menarche/menopause/fertility",

            "11.2 demographic theories",

            "11.3 bio-social determinants of fecundity/fertility/natality/mortality",

            "12 Applications of Anthropology"

        ];


        const paperIITopics = [

            "1.1 Evolution of Indian Culture and Civilization",

            "1.2 Palaeo-Anthropological evidences from India",

            "1.3 Ethno-archaeology in India",

            "2. Demographic profile of India",

            "3.1 The structure and nature of traditional Indian Social System",

            "3.2 Caste system in India",

            "3.3 Sacred Complex & Nature-Man-Spirit Complex",

            "3.4 Impact of Buddhism, Jainism, Islam and Christianity on Indian society",

            "4. Emergence and growth of anthropology in India",

            "5.1 Indian Village",

            "5.2 Linguistic and Religious minorities",

            "5.3 Indigenous and exogenous processes of socio-cultural change",

            "6.1 Tribal situation in India",

            "6.2 Problems of the tribal Communities",

            "6.3 Developmental projects and their impact on tribal",

            "7.1 Problems of Exploitation and Deprivation of SCs, STs and OBCs",

            "7.2 Social Change and Contemporary Tribal societies",

            "7.3 The Concept of Ethnicity",

            "8.1 Impact of Hinduism, Buddhism, Christianity, Islam and other religions on tribal societies",

            "8.2 Tribe & Nation state-comparative study of tribal communities",

            "9.1 History of administration of tribal areas",

            "9.2 Role of Anthropology in Tribal and Rural Development",

            "9.3 Contributions of Anthropology to the Understanding of Regionalism, Communalism, & Ethnic and Political Movements"

        ];


        const years = [

            2026,
            2025,
            2024,
            2023,
            2022,
            2021,
            2020,
            2019,
            2018,
            2017,
            2016

        ];


        /* =========================================
           AUTH UI
        ========================================= */

        async function updateAuthUI() {

            const {
                data: { session }
            } =
                await window.supabaseClient.auth.getSession();


            if (session) {

                loginScreen.style.display = "none";

                mainContent.style.display = "block";

                logoutContainer.style.display = "block";

            } else {

                loginScreen.style.display = "block";

                mainContent.style.display = "none";

                logoutContainer.style.display = "none";

                window.generatedPDF = null;

                const downloadButton =
                    document.getElementById("downloadQCAB");

                if (downloadButton) {
                    downloadButton.style.display = "none";
                }

            }

        }


        /* =========================================
           LOGIN
        ========================================= */

        document
            .getElementById("loginButton")
            .addEventListener("click", async function () {

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("loginPassword")
                        .value;


                if (!email || !password) {

                    loginMessage.textContent =
                        "Please enter your email and password.";

                    return;

                }


                loginMessage.textContent =
                    "Logging in...";


                const {
                    data,
                    error
                } =
                    await window.supabaseClient.auth.signInWithPassword({

                        email: email,
                        password: password

                    });


                if (error) {

                    console.error(error);

                    loginMessage.textContent =
                        error.message;

                    return;

                }


                loginMessage.textContent = "";

                await updateAuthUI();

            });


        /* =========================================
           SHOW SIGNUP
        ========================================= */

        document
            .getElementById("showSignupButton")
            .addEventListener("click", function () {

                loginForm.classList.add("hidden");

                signupForm.classList.remove("hidden");

                loginMessage.textContent = "";

            });


        /* =========================================
           BACK TO LOGIN
        ========================================= */

        document
            .getElementById("backToLoginButton")
            .addEventListener("click", function () {

                signupForm.classList.add("hidden");

                loginForm.classList.remove("hidden");

                loginMessage.textContent = "";

            });


        /* =========================================
           SIGN UP
        ========================================= */

        document
            .getElementById("signupButton")
            .addEventListener("click", async function () {

                const email =
                    document
                        .getElementById("signupEmail")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("signupPassword")
                        .value;


                if (!email || !password) {

                    loginMessage.textContent =
                        "Please enter your email and password.";

                    return;

                }


                if (password.length < 6) {

                    loginMessage.textContent =
                        "Password must be at least 6 characters.";

                    return;

                }


                loginMessage.textContent =
                    "Creating your account...";


                const {
                    data,
                    error
                } =
                    await window.supabaseClient.auth.signUp({

                        email: email,

                        password: password

                    });


                if (error) {

                    console.error(error);

                    loginMessage.textContent =
                        error.message;

                    return;

                }


                /*
                 * If email confirmation is enabled in Supabase,
                 * the user must confirm their email before login.
                 */

                if (data.session) {

                    loginMessage.textContent = "";

                    await updateAuthUI();

                } else {

                    loginMessage.className =
                        "success-message";

                    loginMessage.textContent =
                        "Account created. Please check your email to confirm your account, then login.";

                }

            });


        /* =========================================
           FORGOT PASSWORD
        ========================================= */

        document
            .getElementById("forgotPasswordButton")
            .addEventListener("click", async function () {

                const email =
                    document
                        .getElementById("loginEmail")
                        .value
                        .trim();


                if (!email) {

                    loginMessage.textContent =
                        "Enter your email first, then click Forgot password.";

                    return;

                }


                loginMessage.textContent =
                    "Sending password reset email...";


                const {
                    error
                } =
                    await window.supabaseClient.auth.resetPasswordForEmail(

                        email,

                        {
                            redirectTo:
                                window.location.origin +
                                window.location.pathname
                        }

                    );


                if (error) {

                    console.error(error);

                    loginMessage.textContent =
                        error.message;

                    return;

                }


                loginMessage.className =
                    "success-message";

                loginMessage.textContent =
                    "Password reset email sent. Please check your inbox.";

            });


        /* =========================================
           LOGOUT
        ========================================= */

        document
            .getElementById("logoutButton")
            .addEventListener("click", async function () {

                const {
                    error
                } =
                    await window.supabaseClient.auth.signOut();


                if (error) {

                    console.error(error);

                    alert(
                        "Unable to logout. Please try again."
                    );

                    return;

                }


                await updateAuthUI();

            });


        /* =========================================
           AUTH STATE LISTENER
        ========================================= */

        window.supabaseClient.auth.onAuthStateChange(
            async function (event, session) {

                await updateAuthUI();

            }
        );


        /* =========================================
           INITIAL SESSION CHECK
        ========================================= */

        updateAuthUI();


        /* =========================================
           MODE
        ========================================= */

        let currentMode = "topic";


        const topicModeButton =
            document.getElementById("topicModeButton");

        const yearModeButton =
            document.getElementById("yearModeButton");

        const topicSection =
            document.getElementById("topicSection");

        const yearSection =
            document.getElementById("yearSection");


        topicSection.style.display = "block";

        yearSection.style.display = "none";


        topicModeButton
            .addEventListener("click", function () {

                currentMode = "topic";

                topicModeButton.classList.add("active");

                yearModeButton.classList.remove("active");

                topicSection.style.display = "block";

                yearSection.style.display = "none";

            });


        yearModeButton
            .addEventListener("click", function () {

                currentMode = "year";

                yearModeButton.classList.add("active");

                topicModeButton.classList.remove("active");

                topicSection.style.display = "none";

                yearSection.style.display = "block";

            });


        /* =========================================
           PAPER CHANGE
        ========================================= */

        document
            .getElementById("paperSelect")
            .addEventListener("change", function () {

                const paper =
                    this.value;

                const topicSelect =
                    document.getElementById("topicSelect");

                topicSelect.innerHTML =
                    '<option value="">Select Topic</option>';


                if (paper === "Paper I") {

                    paperITopics.forEach(function (topic) {

                        const option =
                            document.createElement("option");

                        option.value = topic;

                        option.textContent = topic;

                        topicSelect.appendChild(option);

                    });

                }


                if (paper === "Paper II") {

                    paperIITopics.forEach(function (topic) {

                        const option =
                            document.createElement("option");

                        option.value = topic;

                        option.textContent = topic;

                        topicSelect.appendChild(option);

                    });

                }

            });


        /* =========================================
           YEAR DROPDOWN
        ========================================= */

        const yearSelect =
            document.getElementById("yearSelect");


        years.forEach(function (year) {

            const option =
                document.createElement("option");

            option.value = year;

            option.textContent = year;

            yearSelect.appendChild(option);

        });


        /* =========================================
           FETCH QUESTIONS
        ========================================= */

        async function fetchQuestions(filters) {

            if (!window.supabaseClient) {

                alert(
                    "Supabase client not loaded."
                );

                return [];

            }


            const {
                data: { session }
            } =
                await window.supabaseClient.auth.getSession();


            if (!session) {

                alert(
                    "Please login first."
                );

                await updateAuthUI();

                return [];

            }


            try {

                const response =
                    await fetch(

                        API_URL,

                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json",

                                "apikey":
                                    SUPABASE_PUBLISHABLE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    session.access_token

                            },

                            body:
                                JSON.stringify(filters)

                        }

                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    console.error(result);

                    alert(
                        result.error ||
                        "Unable to load questions."
                    );

                    return [];

                }


                return result.questions || [];

            }

            catch (error) {

                console.error(error);

                alert(
                    "Unable to connect to the server."
                );

                return [];

            }

        }


        /* =========================================
           LOAD QUESTIONS
        ========================================= */

        document
            .getElementById("loadQuestions")
            .addEventListener("click", async function () {

                const paper =
                    document
                        .getElementById("paperSelect")
                        .value;


                if (!paper) {

                    alert(
                        "Please select Paper I or Paper II."
                    );

                    return;

                }


                let filters = {

                    paper: paper

                };


                if (currentMode === "topic") {

                    const topic =
                        document
                            .getElementById("topicSelect")
                            .value;


                    if (!topic) {

                        alert(
                            "Please select a topic."
                        );

                        return;

                    }


                    filters.topic = topic;

                }


                if (currentMode === "year") {

                    const year =
                        document
                            .getElementById("yearSelect")
                            .value;


                    if (!year) {

                        alert(
                            "Please select a year."
                        );

                        return;

                    }


                    filters.year = Number(year);

                }


                const questions =
                    await fetchQuestions(filters);


                displayQuestions(questions);

            });


        /* =========================================
           DISPLAY QUESTIONS
        ========================================= */

        function displayQuestions(questions) {

            const questionsCard =
                document.getElementById("questionsCard");

            const questionsList =
                document.getElementById("questionsList");

            const generateCard =
                document.getElementById("generateCard");


            questionsList.innerHTML = "";


            if (!questions.length) {

                questionsList.innerHTML =
                    "<p>No questions found for this selection.</p>";

                questionsCard.style.display =
                    "block";

                generateCard.style.display =
                    "none";

                return;

            }


            questions.forEach(function (question, index) {

                const wrapper =
                    document.createElement("div");

                wrapper.className =
                    "question";


                const label =
                    document.createElement("label");


                const checkbox =
                    document.createElement("input");

                checkbox.type =
                    "checkbox";

                checkbox.className =
                    "question-checkbox";

                checkbox.dataset.question =
                    JSON.stringify(question);


                checkbox.addEventListener(
                    "change",
                    updateSelectedCount
                );


                const content =
                    document.createElement("div");


                const meta =
                    document.createElement("div");

                meta.className =
                    "question-meta";


                meta.textContent =
                    `${question.year || ""} | ${question.marks || ""} Marks | ${question.word_limit || ""} Words`;


                const text =
                    document.createElement("div");


                text.textContent =
                    question.question_text || "";


                content.appendChild(meta);

                content.appendChild(text);


                label.appendChild(checkbox);

                label.appendChild(content);


                wrapper.appendChild(label);


                questionsList.appendChild(wrapper);

            });


            questionsCard.style.display =
                "block";

            generateCard.style.display =
                "block";


            updateSelectedCount();

        }


        /* =========================================
           SELECT ALL
        ========================================= */

        document
            .getElementById("selectAll")
            .addEventListener("click", function () {

                document
                    .querySelectorAll(".question-checkbox")
                    .forEach(function (checkbox) {

                        checkbox.checked =
                            true;

                    });


                updateSelectedCount();

            });


        /* =========================================
           CLEAR ALL
        ========================================= */

        document
            .getElementById("clearAll")
            .addEventListener("click", function () {

                document
                    .querySelectorAll(".question-checkbox")
                    .forEach(function (checkbox) {

                        checkbox.checked =
                            false;

                    });


                updateSelectedCount();

            });


        /* =========================================
           SELECTED COUNT
        ========================================= */

        function updateSelectedCount() {

            const selected =
                document
                    .querySelectorAll(
                        ".question-checkbox:checked"
                    )
                    .length;


            document
                .getElementById("selectedCount")
                .textContent =
                "Selected: " + selected;

        }


        /* =========================================
           GET SELECTED QUESTIONS
        ========================================= */

        window.getSelectedQuestions =
            function () {

                return Array
                    .from(
                        document.querySelectorAll(
                            ".question-checkbox:checked"
                        )
                    )
                    .map(function (checkbox) {

                        return JSON.parse(
                            checkbox.dataset.question
                        );

                    });

            };


    </script>
