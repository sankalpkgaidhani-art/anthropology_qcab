<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anthropology QCAB Generator</title>

    <style>

        :root {
            --navy: #17263c;
            --navy-dark: #101c2d;
            --slate: #e8eef3;
            --slate-border: #b8c5d0;
            --slate-focus: #71859a;
            --background: #f6f3eb;
            --white: #ffffff;
            --text: #252525;
            --muted: #666666;
            --border: #ddd8ca;
        }

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: var(--background);
            color: var(--text);
        }

        h1 {
            text-align: center;
            color: var(--navy);
        }

        .box {
            background: var(--white);
            padding: 25px;
            border-radius: 10px;
            margin-top: 25px;
            border: 1px solid var(--border);
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: var(--text);
        }

        select {
            width: 100%;
            padding: 13px 14px;
            margin-top: 7px;
            font-size: 16px;
            background: var(--slate);
            color: var(--text);
            border: 1px solid var(--slate-border);
            border-radius: 7px;
            box-sizing: border-box;
            outline: none;
            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }

        select:hover {
            background: #e2e9ef;
            border-color: var(--slate-focus);
        }

        select:focus {
            background: var(--white);
            border-color: var(--slate-focus);
            box-shadow: 0 0 0 3px rgba(113, 133, 154, 0.15);
        }

        .question {
            padding: 15px;
            border-bottom: 1px solid var(--border);
        }

        .question label {
            display: inline;
            font-weight: normal;
            color: var(--text);
        }

        button {
            margin-top: 20px;
            padding: 12px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid var(--navy);
            border-radius: 6px;
            background: var(--navy);
            color: white;
        }

        button:hover {
            background: var(--navy-dark);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #downloadPDF {
            display: none;
        }

        .mode-buttons {
            display: flex;
            gap: 0;
            margin-top: 10px;
            border-bottom: 2px solid var(--navy);
        }

        .mode-buttons button {
            margin-top: 0;
            flex: 1;
            border-radius: 6px 6px 0 0;
            border: 1px solid var(--border);
            background: #eeeae0;
            color: var(--navy);
            font-weight: bold;
        }

        .mode-buttons button:hover {
            background: #e4dfd2;
        }

        .mode-buttons button.active {
            background: var(--navy);
            color: white;
            border-color: var(--navy);
            font-weight: bold;
        }

        #questionControls {
            margin-bottom: 15px;
        }

        #questionControls button {
            margin-top: 0;
            margin-right: 8px;
            background: white;
            color: var(--navy);
            border: 1px solid var(--navy);
        }

        #questionControls button:hover {
            background: #eef1f4;
        }

        #selectedCount {
            margin-left: 10px;
            color: var(--navy);
        }

        #loadingMessage {
            color: var(--muted);
            padding: 15px 0;
        }


        /* ================================
           LOGIN SCREEN
           ================================ */

        #loginScreen {
            max-width: 420px;
            margin: 80px auto;
            padding: 30px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 10px;
            text-align: center;
        }

        #loginScreen h2 {
            color: var(--navy);
            margin-top: 0;
        }

        #loginScreen input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px 14px;
            margin-top: 12px;
            font-size: 16px;
            border: 1px solid var(--slate-border);
            border-radius: 7px;
            background: var(--slate);
            outline: none;
        }

        #loginScreen input:focus {
            background: var(--white);
            border-color: var(--slate-focus);
            box-shadow: 0 0 0 3px rgba(113, 133, 154, 0.15);
        }

        #loginButton {
            width: 100%;
        }

        #loginMessage {
            margin-top: 15px;
            color: var(--muted);
        }


        /* ================================
           LOGOUT BUTTON
           ================================ */

        #logoutContainer {
            display: none;
            text-align: right;
            margin-bottom: 10px;
        }

        #logoutButton {
            margin-top: 0;
            background: white;
            color: var(--navy);
            border: 1px solid var(--navy);
        }

        #logoutButton:hover {
            background: #eef1f4;
        }

    </style>

</head>


<body>


    <!-- ==========================================
         LOGIN SCREEN
         ========================================== -->

    <div id="loginScreen">

        <h2>Anthropology QCAB</h2>

        <input
            type="email"
            id="loginEmail"
            placeholder="Email"
        >

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <button id="loginButton" type="button">
            Login
        </button>

        <p id="loginMessage"></p>

    </div>


    <!-- ==========================================
         MAIN WEBSITE
         Hidden until user is authenticated
         ========================================== -->

    <div id="mainContent" style="display: none;">

        <div id="logoutContainer">

            <button id="logoutButton" type="button">
                Logout
            </button>

        </div>


        <h1>Anthropology QCAB Generator</h1>


        <!-- ==========================================
             SELECTION
             ========================================== -->

        <div class="box">

            <label>Selection Mode</label>

            <div class="mode-buttons">

                <button
                    id="topicMode"
                    class="active"
                    type="button"
                >
                    Topic-wise
                </button>

                <button
                    id="yearMode"
                    type="button"
                >
                    Year-wise
                </button>

            </div>


            <label for="paper">
                Select Paper
            </label>

            <select id="paper">

                <option value="">
                    Select Paper
                </option>

                <option value="Paper I">
                    Paper I
                </option>

                <option value="Paper II">
                    Paper II
                </option>

            </select>


            <!-- TOPIC -->

            <div id="topicSection">

                <label for="topic">
                    Select Topic
                </label>

                <select id="topic">

                    <option value="">
                        Select Topic
                    </option>

                </select>

            </div>


            <!-- YEAR -->

            <div
                id="yearSection"
                style="display: none;"
            >

                <label for="year">
                    Select Year
                </label>

                <select id="year">

                    <option value="">
                        Select Year
                    </option>

                </select>

            </div>

        </div>


        <!-- ==========================================
             QUESTIONS
             ========================================== -->

        <div class="box">

            <h2>

                Questions

                <span id="questionCount"></span>

            </h2>


            <div
                id="questionControls"
                style="display: none;"
            >

                <button
                    id="selectAll"
                    type="button"
                >
                    Select All
                </button>

                <button
                    id="clearAll"
                    type="button"
                >
                    Clear All
                </button>

                <strong id="selectedCount">
                    Selected: 0
                </strong>

            </div>


            <div id="questions">
                Select a paper and topic to see questions.
            </div>


            <button
                id="generateQCAB"
                type="button"
            >
                Generate QCAB PDF
            </button>


            <button
                id="downloadPDF"
                type="button"
            >
                Download QCAB PDF
            </button>

        </div>

    </div>


    <!-- ==========================================
         jsPDF
         ========================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


    <!-- ==========================================
         html2canvas
         ========================================== -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>


    <!-- ==========================================
         SUPABASE
         ========================================== -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


    <script>

        // ==========================================
        // SUPABASE CONFIGURATION
        // ==========================================

        const API_URL =
            "https://govhlwqbobforvprdlps.supabase.co/functions/v1/get-questions";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_lr04EFZActHWsuFS9S24QQ_ryPJMYFM";

        const SUPABASE_URL =
            "https://govhlwqbobforvprdlps.supabase.co";


        // Create Supabase client

        window.supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_PUBLISHABLE_KEY
            );


        // ==========================================
        // AUTHENTICATION UI
        // ==========================================

        async function updateAuthUI() {

            const {
                data: { session }
            } =
                await window.supabaseClient.auth.getSession();


            const loginScreen =
                document.getElementById("loginScreen");

            const mainContent =
                document.getElementById("mainContent");

            const logoutContainer =
                document.getElementById("logoutContainer");


            if (session) {

                // ==================================
                // LOGGED IN
                // ==================================

                loginScreen.style.display = "none";

                mainContent.style.display = "block";

                logoutContainer.style.display = "block";

            } else {

                // ==================================
                // LOGGED OUT
                // ==================================

                loginScreen.style.display = "block";

                mainContent.style.display = "none";

                logoutContainer.style.display = "none";

            }

        }


        // ==========================================
        // LOGIN
        // ==========================================

        document
            .getElementById("loginButton")
            .addEventListener(
                "click",
                async function () {

                    const email =
                        document
                            .getElementById("loginEmail")
                            .value
                            .trim();

                    const password =
                        document
                            .getElementById("loginPassword")
                            .value;

                    const message =
                        document.getElementById(
                            "loginMessage"
                        );


                    if (!email || !password) {

                        message.textContent =
                            "Please enter email and password.";

                        return;
                    }


                    message.textContent =
                        "Logging in...";


                    const {
                        data,
                        error
                    } =
                        await window.supabaseClient.auth
                            .signInWithPassword({

                                email: email,
                                password: password

                            });


                    if (error) {

                        message.textContent =
                            error.message;

                        return;
                    }


                    message.textContent =
                        "Login successful!";


                    await updateAuthUI();

                }
            );


        // ==========================================
        // LOGOUT
        // ==========================================

        document
            .getElementById("logoutButton")
            .addEventListener(
                "click",
                async function () {

                    const logoutButton =
                        document.getElementById(
                            "logoutButton"
                        );


                    logoutButton.disabled = true;

                    logoutButton.textContent =
                        "Logging out...";


                    const { error } =
                        await window.supabaseClient.auth
                            .signOut();


                    if (error) {

                        alert(
                            "Logout failed: " +
                            error.message
                        );

                        logoutButton.disabled = false;

                        logoutButton.textContent =
                            "Logout";

                        return;
                    }


                    // Clear password field

                    document
                        .getElementById("loginPassword")
                        .value = "";


                    // Clear any generated PDF

                    window.generatedPDF = null;


                    // Hide download button

                    const downloadButton =
                        document.getElementById(
                            "downloadPDF"
                        );

                    if (downloadButton) {
                        downloadButton.style.display =
                            "none";
                    }


                    // Update authentication UI

                    await updateAuthUI();


                    logoutButton.disabled = false;

                    logoutButton.textContent =
                        "Logout";


                    document
                        .getElementById("loginMessage")
                        .textContent =
                        "You have been logged out.";

                }
            );


        // ==========================================
        // SUPABASE AUTH STATE LISTENER
        // ==========================================

        window.supabaseClient.auth.onAuthStateChange(
            function (event, session) {

                const loginScreen =
                    document.getElementById(
                        "loginScreen"
                    );

                const mainContent =
                    document.getElementById(
                        "mainContent"
                    );

                const logoutContainer =
                    document.getElementById(
                        "logoutContainer"
                    );


                if (session) {

                    loginScreen.style.display =
                        "none";

                    mainContent.style.display =
                        "block";

                    logoutContainer.style.display =
                        "block";

                } else {

                    loginScreen.style.display =
                        "block";

                    mainContent.style.display =
                        "none";

                    logoutContainer.style.display =
                        "none";

                }

            }
        );


        // ==========================================
        // CHECK LOGIN WHEN PAGE LOADS
        // ==========================================

        updateAuthUI();


        // ==========================================
        // VARIABLES
        // ==========================================

        let allQuestions = [];

        let selectionMode = "topic";


        // ==========================================
        // PAPER I TOPICS
        // ==========================================

        const paperITopics = [

            "1.1 Meaning, Scope and development of Anthropology",

            "1.4 Human Evolution and emergence of Man",

            "1.5 Characteristics of Primates",

            "1.6 Phylogenetic status, characteristics and geographical distribution",

            "1.7 The biological basis of life",

            "1.8 Prehistoric Archaeology",

            "2.1 Nature of Culture",

            "2.2 Nature of Society",

            "2.3 Marriage",

            "2.4 Family",

            "2.5 Kinship",

            "3 Economic organization",

            "4 Political organization and Social Control",

            "5 Religion",

            "6.1 Classical evolutionism (Tylor, Morgan and Frazer)",

            "6.2 Historical particularism (Boas); Diffusionism (British, German and American)",

            "6.3 Functionalism (Malinowski); Structural-functionalism (Radcliffe-Brown)",

            "6.4 Structuralism (Levi-Strauss and E. Leach)",

            "6.5 Culture and personality (Benedict, Mead, Linton, Kardiner and Cora-du-Bois)",

            "6.6 Neo-evolutionism (Childe, White, Steward, Sahlins and Service)",

            "6.7 Cultural materialism (Harris)",

            "6.8 Symbolic and interpretive theories (Turner, Schneider and Geertz)",

            "6.9 Cognitive theories (Tyler, Conklin)",

            "6.10 Post-modernism in anthropology",

            "7. Culture, language and communication",

            "8. Research methods in anthropology",

            "9.1 Human Genetics: Methods and Application",

            "9.2 Mendelian genetics",

            "9.3 Genetic polymorphism/selection/Hardy-Weinberg/evolutionary forces/inbreeding/consanguinity/genetic load",

            "9.4 Chromosomes/aberrations, sex/autosomal syndromes, genetic imprinting/screening/counselling/DNA profiling/gene mapping/genome study",

            "9.5 Race/racism/morphological variation/racial criteria/classification/differentiation/race crossing",

            "9.6 Genetic markers/blood groups/physiology",

            "9.7 Ecological Anthropology/biocultural adaptation/environmental stresses/conservation",

            "9.8 Epidemiological Anthropology/health/disease/malnutrition",

            "10 Human growth/development/somatotypes/ageing/growth methods",

            "11.1 menarche/menopause/fertility",

            "11.2 demographic theories",

            "11.3 bio-social determinants of fecundity/fertility/natality/mortality",

            "12 Applications of Anthropology"

        ];


        // ==========================================
        // PAPER II TOPICS
        // ==========================================

        const paperIITopics = [

            "1.1 Evolution of Indian Culture and Civilization",

            "1.2 Palaeo-Anthropological evidences from India",

            "1.3 Ethno-archaeology in India",

            "2. Demographic profile of India",

            "3.1 The structure and nature of traditional Indian Social System",

            "3.2 Caste system in India",

            "3.3 Sacred Complex & Nature-Man-Spirit Complex",

            "3.4 Impact of Buddhism, Jainism, Islam and Christianity on Indian society",

            "4. Emergence and growth of anthropology in India",

            "5.1 Indian Village",

            "5.2 Linguistic and Religious minorities",

            "5.3 Indigenous and exogenous processes of socio-cultural change",

            "6.1 Tribal situation in India",

            "6.2 Problems of the tribal Communities",

            "6.3 Developmental projects and their impact on tribal",

            "7.1 Problems of Exploitation and Deprivation of SCs, STs and OBCs",

            "7.2 Social Change and Contemporary Tribal societies",

            "7.3 The Concept of Ethnicity",

            "8.1 Impact of Hinduism, Buddhism, Christianity, Islam and other religions on tribal societies",

            "8.2 Tribe & Nation state-comparative study of tribal communities",

            "9.1 History of administration of tribal areas",

            "9.2 Role of Anthropology in Tribal and Rural Development",

            "9.3 Contributions of Anthropology to the Understanding of Regionalism, Communalism, & Ethnic and Political Movements"

        ];


        // ==========================================
        // LOAD TOPIC DROPDOWN
        // ==========================================

        function loadTopics() {

            const selectedPaper =
                document.getElementById("paper").value;

            const topicSelect =
                document.getElementById("topic");


            topicSelect.innerHTML =
                '<option value="">Select Topic</option>';


            if (!selectedPaper) {
                return;
            }


            const topics =
                selectedPaper === "Paper I"
                    ? paperITopics
                    : paperIITopics;


            topics.forEach(topic => {

                const option =
                    document.createElement("option");

                option.value = topic;

                option.textContent = topic;

                topicSelect.appendChild(option);

            });

        }


        // ==========================================
        // LOAD YEAR DROPDOWN
        // ==========================================

        function loadYears() {

            const yearSelect =
                document.getElementById("year");


            yearSelect.innerHTML =
                '<option value="">Select Year</option>';


            const years = [

                2026,
                2025,
                2024,
                2023,
                2022,
                2021,
                2020,
                2019,
                2018,
                2017,
                2016

            ];


            years.forEach(year => {

                const option =
                    document.createElement("option");

                option.value = year;

                option.textContent = year;

                yearSelect.appendChild(option);

            });

        }


        // ==========================================
        // FETCH QUESTIONS FROM SUPABASE
        // ==========================================

        async function fetchQuestions(filters) {

            try {

                const {
                    data: { session }
                } =
                    await window.supabaseClient.auth
                        .getSession();


                // ==================================
                // EXTRA AUTH CHECK
                // ==================================

                if (!session) {

                    alert(
                        "Please login first."
                    );

                    await updateAuthUI();

                    return [];

                }


                const response =
                    await fetch(API_URL, {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json",

                            "apikey":
                                SUPABASE_PUBLISHABLE_KEY,

                            "Authorization":
                                "Bearer " +
                                session.access_token

                        },

                        body:
                            JSON.stringify(filters)

                    });


                if (!response.ok) {

                    throw new Error(
                        "Server returned " +
                        response.status
                    );

                }


                const data =
                    await response.json();


                if (data.error) {

                    throw new Error(
                        data.error
                    );

                }


                return data.questions || [];


            } catch (error) {

                console.error(
                    "Error loading questions:",
                    error
                );

                throw error;

            }

        }


        // ==========================================
        // MODE BUTTONS
        // ==========================================

        document
            .getElementById("topicMode")
            .addEventListener(
                "click",
                function () {

                    selectionMode = "topic";


                    document
                        .getElementById("topicMode")
                        .classList.add("active");


                    document
                        .getElementById("yearMode")
                        .classList.remove("active");


                    document
                        .getElementById("topicSection")
                        .style.display = "block";


                    document
                        .getElementById("yearSection")
                        .style.display = "none";


                    resetQuestions();

                    loadTopics();

                }
            );


        document
            .getElementById("yearMode")
            .addEventListener(
                "click",
                function () {

                    selectionMode = "year";


                    document
                        .getElementById("yearMode")
                        .classList.add("active");


                    document
                        .getElementById("topicMode")
                        .classList.remove("active");


                    document
                        .getElementById("topicSection")
                        .style.display = "none";


                    document
                        .getElementById("yearSection")
                        .style.display = "block";


                    resetQuestions();

                    loadYears();

                }
            );


        // ==========================================
        // PAPER CHANGE
        // ==========================================

        document
            .getElementById("paper")
            .addEventListener(
                "change",
                function () {

                    resetQuestions();


                    if (selectionMode === "topic") {

                        loadTopics();

                    } else {

                        loadYears();

                    }

                }
            );


        // ==========================================
        // TOPIC CHANGE
        // ==========================================

        document
            .getElementById("topic")
            .addEventListener(
                "change",
                showQuestions
            );


        // ==========================================
        // YEAR CHANGE
        // ==========================================

        document
            .getElementById("year")
            .addEventListener(
                "change",
                showQuestions
            );


        // ==========================================
        // SHOW QUESTIONS
        // ==========================================

        async function showQuestions() {

            const selectedPaper =
                document.getElementById("paper").value;


            const questionContainer =
                document.getElementById("questions");


            if (!selectedPaper) {

                questionContainer.innerHTML =
                    "Select a paper to see questions.";

                return;

            }


            // ======================================
            // TOPIC-WISE
            // ======================================

            if (selectionMode === "topic") {

                const selectedTopic =
                    document.getElementById("topic").value;


                if (!selectedTopic) {

                    questionContainer.innerHTML =
                        "Select a paper and topic to see questions.";

                    return;

                }


                questionContainer.innerHTML =
                    '<div id="loadingMessage">Loading questions...</div>';


                document
                    .getElementById("questionControls")
                    .style.display = "none";


                try {

                    allQuestions =
                        await fetchQuestions({

                            paper:
                                selectedPaper,

                            topic:
                                selectedTopic

                        });


                    displayQuestions(
                        allQuestions
                    );


                } catch (error) {

                    questionContainer.innerHTML =
                        "Error loading questions. Please try again.";

                }

            }


            // ======================================
            // YEAR-WISE
            // ======================================

            else {

                const selectedYear =
                    document.getElementById("year").value;


                if (!selectedYear) {

                    questionContainer.innerHTML =
                        "Select a paper and year to see questions.";

                    return;

                }


                questionContainer.innerHTML =
                    '<div id="loadingMessage">Loading questions...</div>';


                document
                    .getElementById("questionControls")
                    .style.display = "none";


                try {

                    allQuestions =
                        await fetchQuestions({

                            paper:
                                selectedPaper,

                            year:
                                Number(selectedYear)

                        });


                    displayQuestions(
                        allQuestions
                    );


                } catch (error) {

                    questionContainer.innerHTML =
                        "Error loading questions. Please try again.";

                }

            }

        }


        // ==========================================
        // DISPLAY QUESTIONS
        // ==========================================

        function displayQuestions(
            matchingQuestions
        ) {

            const questionContainer =
                document.getElementById(
                    "questions"
                );


            // SORT

            matchingQuestions.sort(

                (a, b) =>
                    Number(b.year) -
                    Number(a.year)

            );


            // NO QUESTIONS

            if (
                matchingQuestions.length === 0
            ) {

                questionContainer.innerHTML =
                    "No questions found.";


                document
                    .getElementById(
                        "questionControls"
                    )
                    .style.display = "none";


                document
                    .getElementById(
                        "questionCount"
                    )
                    .textContent = "";


                return;

            }


            // CLEAR OLD QUESTIONS

            questionContainer.innerHTML =
                "";


            // SHOW CONTROLS

            document
                .getElementById(
                    "questionControls"
                )
                .style.display = "block";


            document
                .getElementById(
                    "questionCount"
                )
                .textContent =
                " (" +
                matchingQuestions.length +
                ")";


            document
                .getElementById(
                    "selectedCount"
                )
                .textContent =
                "Selected: 0";


            // DISPLAY QUESTIONS

            matchingQuestions.forEach(
                question => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "question";


                    div.innerHTML = `

                        <input
                            type="checkbox"
                            value="${
                                question.question_id ||
                                question.id
                            }"
                        >

                        <label>

                            <strong>
                                ${question.year || ""}
                            </strong>

                            <br>

                            ${question.question_text}

                            <br>

                            <small>

                                ${
                                    question.marks != null
                                    ? question.marks +
                                      " Marks"
                                    : "Marks not specified"
                                }

                                ${
                                    question.word_limit
                                    ? " | " +
                                      question.word_limit +
                                      " Words"
                                    : ""
                                }

                            </small>

                        </label>

                    `;


                    questionContainer.appendChild(
                        div
                    );

                }
            );

        }


        // ==========================================
        // RESET QUESTIONS
        // ==========================================

        function resetQuestions() {

            allQuestions = [];


            document
                .getElementById("questions")
                .innerHTML =
                "Select a paper and topic to see questions.";


            document
                .getElementById(
                    "questionControls"
                )
                .style.display = "none";


            document
                .getElementById(
                    "questionCount"
                )
                .textContent = "";


            document
                .getElementById(
                    "selectedCount"
                )
                .textContent =
                "Selected: 0";

        }


        // ==========================================
        // SELECT ALL
        // ==========================================

        document
            .getElementById("selectAll")
            .addEventListener(
                "click",
                function () {

                    const checkboxes =
                        document.querySelectorAll(
                            '#questions input[type="checkbox"]'
                        );


                    checkboxes.forEach(
                        checkbox => {

                            checkbox.checked =
                                true;

                        }
                    );


                    updateSelectedCount();

                }
            );


        // ==========================================
        // CLEAR ALL
        // ==========================================

        document
            .getElementById("clearAll")
            .addEventListener(
                "click",
                function () {

                    const checkboxes =
                        document.querySelectorAll(
                            '#questions input[type="checkbox"]'
                        );


                    checkboxes.forEach(
                        checkbox => {

                            checkbox.checked =
                                false;

                        }
                    );


                    updateSelectedCount();

                }
            );


        // ==========================================
        // UPDATE SELECTED COUNT
        // ==========================================

        function updateSelectedCount() {

            const checkedBoxes =
                document.querySelectorAll(
                    '#questions input[type="checkbox"]:checked'
                );


            document
                .getElementById(
                    "selectedCount"
                )
                .textContent =
                "Selected: " +
                checkedBoxes.length;

        }


        // ==========================================
        // CHECKBOX CHANGE
        // ==========================================

        document
            .getElementById("questions")
            .addEventListener(
                "change",
                function (event) {

                    if (
                        event.target.type ===
                        "checkbox"
                    ) {

                        updateSelectedCount();

                    }

                }
            );


        // ==========================================
        // SELECTED QUESTIONS
        // ==========================================

        window.getSelectedQuestions =
            function () {

                const checkedBoxes =
                    document.querySelectorAll(
                        '#questions input[type="checkbox"]:checked'
                    );


                const selectedIds =
                    Array.from(
                        checkedBoxes
                    ).map(
                        checkbox =>
                            String(
                                checkbox.value
                            )
                    );


                const selectedQuestions =
                    allQuestions.filter(
                        question => {

                            const questionId =
                                String(
                                    question.question_id ||
                                    question.id
                                );


                            return selectedIds.includes(
                                questionId
                            );

                        }
                    );


                console.log(
                    "Selected IDs:",
                    selectedIds
                );


                console.log(
                    "Selected questions:",
                    selectedQuestions
                );


                return selectedQuestions;

            };


        // ==========================================
        // INITIAL LOAD
        // ==========================================

        loadTopics();

    </script>
